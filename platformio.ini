[env:esp32dev]
extra_scripts = pre:tools/build_security.py
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
lib_deps =
  bblanchon/ArduinoJson@6.21.5
  tzapu/WiFiManager
  ESP32Async/AsyncTCP
  ESP32Async/ESPAsyncWebServer
build_flags =
  -DCORE_DEBUG_LEVEL=1
