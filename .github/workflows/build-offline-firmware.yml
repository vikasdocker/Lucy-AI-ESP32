name: Build Lucy Offline OS firmware

on:
  push:
    branches: [ offline-os-v1 ]
    paths:
      - "offline/**"
      - ".github/workflows/build-offline-firmware.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio
      - name: Build offline firmware
        working-directory: offline
        run: pio run
      - name: Stage firmware
        run: |
          mkdir -p release
          cp offline/.pio/build/lucy_offline/firmware.bin release/lucy-offline-esp32dev.bin
          sha256sum release/lucy-offline-esp32dev.bin > release/SHA256SUMS.txt
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: lucy-offline-esp32-firmware
          path: release/
          retention-days: 30
