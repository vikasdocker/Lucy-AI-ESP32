name: Build Lucy AI ESP32 firmware

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build ESP32 firmware
        run: |
          . .venv/bin/activate
          pio run -e esp32dev

      - name: Stage firmware
        run: |
          mkdir -p release
          cp .pio/build/esp32dev/firmware.bin release/lucy-ai-esp32dev.bin
          sha256sum release/lucy-ai-esp32dev.bin > release/SHA256SUMS.txt

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: lucy-ai-esp32-firmware
          path: release/
          retention-days: 30
