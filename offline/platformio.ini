[platformio]
default_envs = lucy_c3_mini

[env]
extra_scripts = pre:../tools/build_security.py
platform = espressif32@6.10.0
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_deps =
  olikraus/U8g2@2.36.5
  adafruit/RTClib@2.1.4
  bblanchon/ArduinoJson@6.21.5
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DLUCY_OFFLINE_BUILD=1

[env:lucy_offline]
board = esp32dev

[env:lucy_c3_mini]
board = esp32-c3-devkitm-1
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

[env:lucy_clipbot_c3]
board = esp32-c3-devkitm-1
; Two OTA app slots, unlike huge_app.csv. Confirm CURRENT device partitions
; match before attempting a web OTA upload.
board_build.partitions = min_spiffs.csv
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DLUCY_CLIPBOT_C3=1
